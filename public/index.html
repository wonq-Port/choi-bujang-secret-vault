<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BYTE BACK | 보호된 자료실</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { margin: 0; min-height: 100vh; background: #101a28; color: #ecf4ff; }
    main { max-width: 760px; margin: 0 auto; padding: 44px 22px 64px; }
    .eyebrow { color: #8ad8df; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
    h1 { margin: 16px 0; font-size: clamp(30px, 7vw, 48px); line-height: 1.2; }
    p { font-size: 17px; line-height: 1.7; color: #bfd0e5; }
    .card { margin: 20px 0; padding: 18px; border: 1px solid #51667c; border-radius: 14px; background: #1a2a3d; }
    ul { list-style: none; display: grid; gap: 12px; padding: 0; }
    li { border: 1px solid #51667c; border-radius: 14px; padding: 17px 19px; background: #1a2a3d; display: flex; justify-content: space-between; align-items: flex-start; }
    .memo-text { flex-grow: 1; }
    strong { display: block; font-size: 18px; margin-bottom: 5px; }
    li span { color: #bfd0e5; word-break: break-all; }
    .actions { display: flex; gap: 8px; margin-left: 12px; }
    button { padding: 8px 14px; border-radius: 6px; border: 1px solid #51667c; background: #101a28; color: #fff; cursor: pointer; font-size: 14px; }
    button.primary { background: #8ad8df; color: #101a28; font-weight: bold; border: none; }
    button.danger { border-color: #ff6b81; color: #ff6b81; }
    input, textarea { padding: 10px; border-radius: 6px; border: 1px solid #51667c; background: #101a28; color: #fff; width: 100%; box-sizing: border-box; }
  </style>
</head>
<body>
  <main>
    <div class="eyebrow">BYTE BACK · 5단계 서버 집중화</div>
    <h1>보호된 자료실</h1>
    <p>모든 데이터와 인증 요청이 서버를 통해서만 안전하게 처리됩니다.</p>

    <!-- 1. 인증 영역 -->
    <div id="auth-container" class="card">
      <div id="logged-out-view">
        <h3 style="margin-top: 0;">로그인</h3>
        <form id="login-form" style="display: flex; gap: 8px; flex-wrap: wrap;">
          <input type="email" id="auth-email" placeholder="이메일" required style="width: auto; flex: 1;" />
          <input type="password" id="auth-password" placeholder="비밀번호" required style="width: auto; flex: 1;" />
          <button type="submit" class="primary">로그인</button>
        </form>
        <div id="auth-error" style="color: #ff6b81; margin-top: 10px; font-size: 14px;"></div>
      </div>

      <div id="logged-in-view" style="display: none; align-items: center; justify-content: space-between;">
        <span id="user-display" style="font-weight: bold; color: #8ad8df;"></span>
        <button id="logout-btn">로그아웃</button>
      </div>
    </div>

    <!-- 2. 메모 작성 영역 -->
    <div id="create-container" class="card" style="display: none;">
      <h3 style="margin-top: 0;">새 가상 메모 추가</h3>
      <form id="create-form" style="display: grid; gap: 10px;">
        <input type="text" id="new-title" placeholder="제목" required />
        <textarea id="new-body" placeholder="내용" rows="3" required></textarea>
        <div>
          <button type="submit" class="primary">메모 추가</button>
        </div>
      </form>
    </div>

    <!-- 3. 메모 목록 -->
    <ul id="notes" aria-live="polite">
      <li>로그인 후 가상 자료를 확인할 수 있습니다.</li>
    </ul>
  </main>

  <script type="module">
    // 화면에 Supabase 키나 SDK가 전혀 존재하지 않음!
    const list = document.querySelector('#notes');
    const loggedOutView = document.getElementById('logged-out-view');
    const loggedInView = document.getElementById('logged-in-view');
    const userDisplay = document.getElementById('user-display');
    const authError = document.getElementById('auth-error');
    const loginForm = document.getElementById('login-form');
    const logoutBtn = document.getElementById('logout-btn');
    const createContainer = document.getElementById('create-container');
    const createForm = document.getElementById('create-form');

    let currentToken = null;
    let currentUser = null;

    // 1. 메모 로드
    async function loadMemos() {
      if (!currentToken) {
        list.innerHTML = '<li>로그인 후 가상 자료를 확인할 수 있습니다.</li>';
        return;
      }

      try {
        const response = await fetch('/api/memos', {
          headers: { 'Authorization': `Bearer ${currentToken}` },
          cache: 'no-store'
        });

        if (!response.ok) throw new Error('자료를 불러올 수 없습니다.');
        const data = await response.json();
        const memos = Array.isArray(data) ? data : (data.notes || []);

        if (memos.length === 0) {
          list.innerHTML = '<li>등록된 가상 메모가 없습니다.</li>';
          return;
        }

        list.replaceChildren(...memos.map(note => {
          const item = document.createElement('li');
          const textDiv = document.createElement('div');
          textDiv.className = 'memo-text';
          const title = document.createElement('strong');
          title.textContent = note.title;
          const body = document.createElement('span');
          body.textContent = note.body || note.content || '';
          textDiv.append(title, body);

          const actionsDiv = document.createElement('div');
          actionsDiv.className = 'actions';

          const editBtn = document.createElement('button');
          editBtn.textContent = '수정';
          editBtn.onclick = () => updateMemo(note.id, note.title, note.body || note.content);

          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'danger';
          deleteBtn.textContent = '삭제';
          deleteBtn.onclick = () => deleteMemo(note.id);

          actionsDiv.append(editBtn, deleteBtn);
          item.append(textDiv, actionsDiv);
          return item;
        }));
      } catch (err) {
        list.innerHTML = `<li>${err.message}</li>`;
      }
    }

    // 2. 메모 추가
    createForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!currentToken) return;

      const title = document.getElementById('new-title').value;
      const body = document.getElementById('new-body').value;

      try {
        const res = await fetch('/api/memos', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentToken}`
          },
          body: JSON.stringify({ title, body })
        });
        if (res.ok) {
          createForm.reset();
          loadMemos();
        } else {
          alert('메모 추가 실패');
        }
      } catch (err) {
        alert('네트워크 오류');
      }
    });

    // 3. 메모 수정
    async function updateMemo(id, oldTitle, oldBody) {
      const newTitle = prompt('수정할 제목:', oldTitle);
      if (newTitle === null) return;
      const newBody = prompt('수정할 내용:', oldBody);
      if (newBody === null) return;

      try {
        const res = await fetch(`/api/memos/${id}`, {
          method: 'PUT',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${currentToken}`
          },
          body: JSON.stringify({ title: newTitle, body: newBody })
        });
        if (res.ok) {
          loadMemos();
        } else {
          alert('메모 수정 실패');
        }
      } catch (err) {
        alert('네트워크 오류');
      }
    }

    // 4. 메모 삭제
    async function deleteMemo(id) {
      if (!confirm('정말 삭제하시겠습니까?')) return;

      try {
        const res = await fetch(`/api/memos/${id}`, {
          method: 'DELETE',
          headers: { 'Authorization': `Bearer ${currentToken}` }
        });
        if (res.ok) {
          loadMemos();
        } else {
          alert('메모 삭제 실패');
        }
      } catch (err) {
        alert('네트워크 오류');
      }
    }

    // 5. 로그인 (서버 함수 /api/login 호출)
    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      authError.textContent = '';
      const email = document.getElementById('auth-email').value;
      const password = document.getElementById('auth-password').value;

      try {
        const res = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (!res.ok) {
          authError.textContent = `로그인 실패: ${data.error || '인증 오류'}`;
          return;
        }

        currentToken = data.access_token;
        currentUser = data.user;

        loggedOutView.style.display = 'none';
        loggedInView.style.display = 'flex';
        createContainer.style.display = 'block';
        userDisplay.textContent = `${currentUser.email} 님 접속 중`;
        loadMemos();
      } catch (err) {
        authError.textContent = '로그인 서버 연결 오류';
      }
    });

    // 6. 로그아웃
    logoutBtn.addEventListener('click', () => {
      currentToken = null;
      currentUser = null;
      loggedOutView.style.display = 'block';
      loggedInView.style.display = 'none';
      createContainer.style.display = 'none';
      document.getElementById('auth-password').value = '';
      loadMemos();
    });
  </script>
</body>
</html>
